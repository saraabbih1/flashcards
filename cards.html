<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards</title>

   <link href="src/output.css" rel="stylesheet">

</head>

<body class="bg-pink-400 min-h-screen flex flex-col items-center justify-center text-center text-purple-900">

  <!-- Header -->
  <header class="absolute top-0 left-0 w-full flex justify-between px-10 py-4 text-purple-900 text-sm">
    <h1 class="text-3xl italic text-purple-800">Cards</h1>
    <nav class="space-x-6">
      <a href="#" class="hover:underline">flashcard</a>
      <a href="#" class="hover:underline">quiz</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="mt-20 bg-pink-300 rounded-2xl p-10 shadow-lg w-[400px] flex flex-col items-center text-center">
    <!-- Image -->
    <img src="imgcard/Pencil free icons designed by Freepik.jpeg"
         alt="flashcards"
         class="w-28 h-28 mb-6 rounded-lg">

    <!-- Title -->
    <h2 class="text-2xl font-bold mb-3 text-purple-800 font-['Comic_Sans_MS']">
      make flashcard
    </h2>

    <!-- Description -->
    <p class="text-sm text-purple-900 leading-relaxed mb-8">
      Creating your own flashcards is easy with our free maker.<br>
      Just add a term and its definition — you can even pick an image from our library.<br>
      When your set is ready, study it anytime and share it with friends.
    </p>

    <!-- Start Button -->
    <button class="bg-pink-200 text-purple-900 font-semibold rounded-full px-8 py-2 hover:bg-pink-100 transition">
      start
    </button>
  </main>

</body>
</html>
