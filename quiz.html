<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz JSON</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .correct { background-color: #16a34a !important; color: white !important; }
    .wrong { background-color: #dc2626 !important; color: white !important; }
    .disabled { pointer-events: none; opacity: 0.6; }
  </style>
</head>

<body class="bg-pink-400 min-h-screen flex justify-center items-center p-6">
   <header class="absolute top-0 left-0 w-full flex justify-between px-10 py-4 text-purple-900 text-sm bg-white/40">
    <h1 class="text-3xl italic text-purple-800">Cards</h1>
    <nav class="space-x-6">
      <a href="index.html" class=" hover:underline ml-3">inscription</a>
      <a href="cards.html" class=" hover:underline ml-3">card</a>
      <a href="accquiz.html" class="hover:underline">quiz</a>
    </nav>
  </header>

<div class="w-full max-w-lg bg-pink-300 p-6 rounded-2xl shadow-xl text-center">

  <h1 class="text-3xl font-bold italic text-purple-800 mb-4">Quiz JSON</h1>

  <div class="flex justify-between text-purple-900 font-semibold mb-3">
    <span id="scoreText">Score : 0</span>
    <span id="highScoreText">High Score : 0</span>
  </div>

  <h2 id="question" class="text-xl font-bold mb-4 text-purple-800"></h2>

  <div id="options" class="space-y-3"></div>

  <div class="flex justify-between mt-6">
    <button id="backBtn" 
            class="px-4 py-2 bg-pink-200 text-purple-900 rounded-full hover:bg-pink-100 transition">
      Back
    </button>
    <button id="showAnswerBtn" 
            class="px-4 py-2 bg-purple-600 text-white rounded-full hover:bg-purple-700 transition">
      Show Answer
    </button>
    <button id="nextBtn" 
            class="px-4 py-2 bg-pink-200 text-purple-900 rounded-full hover:bg-pink-100 transition">
      Next
    </button>
  </div>

  <div id="finalScreen" class="hidden mt-6">
    <h2 class="text-2xl font-bold text-purple-800">Quiz terminé 🎉</h2>
    <p id="finalScore" class="text-lg my-2 text-purple-900"></p>
    <p id="finalHighScore" class="text-lg font-bold text-green-600"></p>

    <button onclick="restartQuiz()" 
            class="mt-4 px-4 py-2 bg-pink-200 text-purple-900 rounded-full w-full hover:bg-pink-100 transition">
      Rejouer
    </button>
  </div>

</div>

<script src="quiz.js"></script>
</body>
</html>
